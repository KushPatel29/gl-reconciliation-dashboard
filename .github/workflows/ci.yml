name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "35 7 * * 3"
  push:
    branches: [master, main]
  pull_request:

jobs:
  reconciliation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r data_generator/requirements.txt
          pip install pytest

      - name: Generate fresh synthetic GL data
        run: python data_generator/generate_gl_data.py

      - name: Run reconciliation engine end-to-end
        run: python engine/run_reconciliation.py

      - name: Journal-entry control tests and exception ageing
        run: |
          python data_generator/generate_journal_detail.py
          python engine/journal_risk.py
          python engine/exception_ageing.py

      - name: The published control figures must be reproducible byte for byte
        run: |
          git diff --exit-code --             output/journal_risk_entries.csv output/journal_risk_flags.csv             output/journal_risk_by_user.csv output/benford_by_dimension.csv             output/journal_risk_summary.json output/journal_risk_headline.csv             output/exception_ageing.csv output/exception_sla_by_owner.csv             output/exception_sla_by_type.csv output/exception_throughput.csv             output/exception_clear_methods.csv             output/exception_ageing_summary.json             output/exception_ageing_headline.csv             data/dim_user.csv data/journal_control.csv             data/exception_workflow.csv

      - name: FinOps mode — FOCUS billing demo through the unmodified engine
        run: python finops/focus_demo.py

      - name: FinOps mode — scaled FOCUS dataset + allocation coverage
        run: |
          python finops/generate_focus_data.py
          python finops/run_finops_recon.py

      - name: Tableau — rebuild extracts and workbook, prove reproducibility
        run: |
          python tableau/prepare_tableau_data.py
          python tableau/build_workbook.py
          git diff --exit-code -- tableau/

      - name: Run reconciliation tests
        run: pytest tests/ -v
