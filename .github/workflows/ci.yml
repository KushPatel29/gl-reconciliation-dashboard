name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "35 7 * * 3"
  push:
    branches: [master, main]
  pull_request:

jobs:
  reconciliation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r data_generator/requirements.txt
          pip install pytest

      - name: Generate fresh synthetic GL data
        run: python data_generator/generate_gl_data.py

      - name: Reconcile against the COMMITTED ledger, not the one just written
        # generate_gl_data.py is not byte-reproducible across machines. The
        # runner installs exactly the versions the committed data was written
        # with - pandas 3.0.3, numpy 1.26.3, Faker 40.28.1, Python 3.12 - and
        # still produces a different source_erp_gl.csv on Linux than the
        # workstation did on Windows. It predates this gate and making it
        # reproducible would rewrite every figure in this repository, the
        # screenshots and the Tableau workbook with it; that is a change of its
        # own, not a side effect of this one.
        #
        # The step above still proves the generator RUNS end to end. Restoring
        # the committed ledger here makes the gate below a claim about the
        # ANALYTICS - given this ledger, every published figure regenerates
        # byte for byte - which is the claim the analytics can actually keep,
        # and the one the README's numbers depend on.
        run: git checkout -- data/

      - name: Run reconciliation engine end-to-end
        run: python engine/run_reconciliation.py

      - name: Journal-entry control tests and exception ageing
        run: |
          python data_generator/generate_journal_detail.py
          python engine/journal_risk.py
          python engine/exception_ageing.py

      - name: The published control figures must be reproducible byte for byte
        run: |
          if git diff --quiet; then
            echo "every published figure regenerated byte for byte"
          else
            echo "::error::published figures are not reproducible:"
            git status --porcelain | head -6 | while read -r line; do
              echo "::error::$line"
            done
            git diff --unified=0 | sed -n '5,10p' | while read -r line; do
              echo "::error::${line:0:180}"
            done
            exit 1
          fi

      - name: FinOps mode — FOCUS billing demo through the unmodified engine
        run: python finops/focus_demo.py

      - name: FinOps mode — scaled FOCUS dataset + allocation coverage
        run: |
          python finops/generate_focus_data.py
          python finops/run_finops_recon.py

      - name: Tableau — rebuild extracts and workbook, prove reproducibility
        run: |
          python tableau/prepare_tableau_data.py
          python tableau/build_workbook.py
          git diff --exit-code -- tableau/

      - name: Run reconciliation tests
        run: pytest tests/ -v
